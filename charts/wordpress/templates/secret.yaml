{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wordpress.fullname" . }}
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.values }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
{{- if not .Values.database.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wordpress.dbSecretName" . }}
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
type: Opaque
stringData:
  WORDPRESS_DB_PASSWORD: {{ required "database.password or database.existingSecret is required" .Values.database.password | quote }}
{{- end }}
