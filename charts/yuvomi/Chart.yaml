apiVersion: v2
name: yuvomi
description: |
  Yuvomi is a self-hosted family planner: calendar, tasks, meals, shopping,
  budget, documents and more in one app. Single Node.js container with an
  embedded SQLite/SQLCipher database - no external database required.
